if(!info.rows.length){const descriptions={'마력 연쇄':'일반 스킬 등 직접 공격 적중 시 마력 연쇄를 소모하여 추가 피해를 발생시킵니다. 별도의 추가 피해가 다시 마력 연쇄를 소모하는 경로는 현재 제외합니다.','보호막':'적에게 공격받을 때 보호막이 HP 피해를 먼저 흡수합니다. 특정 공격 스킬과 연결되는 효과가 아니라 생존을 지원하는 효과입니다.','AP 지원':'회복한 파티 공용 AP를 일반 스킬·배틀 스킬 등 AP를 사용하는 후속 행동에 활용합니다.','치명타 확률 증가':'치명타 판정이 있는 일반 스킬·배틀 스킬·공격형 궁극기 등에 적용됩니다. 화상처럼 치명타가 없는 피해에는 적용되지 않습니다.'};return `<article class="linked-skill">${scopeHeader}<div class="skill-labels"><b>[${c.name}]</b><span>[적용 범위]</span></div><div class="linked-name"><span>적용되는 행동</span><strong>${esc(info.hint)}</strong></div><div class="linked-effects"><span class="effects-label">효과 설명</span><p>${descriptions[e.key]||e.description}</p></div></article>`}

let termAnchor=null,termPinned=false,termHideTimer=0;

function termPosition(anchor,box,width,height){const gap=8,pad=10,lo=pad,hi=Math.max(pad,box.width-width-pad);let left=Math.min(hi,Math.max(lo,anchor.left-box.left));const below=anchor.bottom-box.top+gap,above=anchor.top-box.top-height-gap;let top=below+height<=box.height-pad?below:above>=pad?above:Math.max(pad,Math.min(below,box.height-height-pad));return{left,top};}

// Handle mobile taps at the actual UI roots, without relying on synthetic

function activateRelationControl(e){const inline=e.target.closest('[data-inline-term]');if(inline){showInlineTerm(inline,true);return;}const pick=e.target.closest('[data-pick]');if(pick){choose(pick.dataset.pick);return;}const m=e.target.closest('[data-mode]'),tab=e.target.closest('[data-source-tab]'),term=e.target.closest('[data-term]'),cat=e.target.closest('[data-category]'),p=e.target.closest('[data-partner]'),c=e.target.closest('[data-character]'),s=e.target.closest('[data-source]');if(m){closePicker();mode=m.dataset.mode;selected='';category='all';render()}if(tab){sourceTab=tab.dataset.sourceTab;renderSource();document.querySelector(`[data-source-tab="${sourceTab}"]`)?.focus()}if(term)showTerm(term.dataset.term,term,true);if(cat){category=cat.dataset.category;selected='';render();document.querySelector(`[data-category="${category}"]`)?.focus()}if(p){selected=p.dataset.partner;render();scrollTo('#detail')}if(c){choose(c.dataset.character);scrollTo('#filter-panel')}if(s)openSource(s.dataset.source)}
const relationActionSelector='[data-inline-term],[data-pick],[data-mode],[data-source-tab],[data-term],[data-category],[data-partner],[data-character],[data-source]';
function bindRelationTouch(root){
 let start=null,lastTap=null;
 root.addEventListener('touchstart',e=>{
  const t=e.touches.length===1?e.touches[0]:null;
  start=t?{x:t.clientX,y:t.clientY,target:e.target.closest(relationActionSelector),moved:false}:null;
 },{passive:true});
 root.addEventListener('touchmove',e=>{if(start){const t=e.touches[0];if(e.touches.length!==1||!t||Math.hypot(t.clientX-start.x,t.clientY-start.y)>10)start.moved=true;}},{passive:true});
 root.addEventListener('touchcancel',()=>{start=null;},{passive:true});

  const gesture=start;start=null;
  const target=e.target.closest(relationActionSelector),t=e.changedTouches[0];
  if(!gesture||gesture.moved||!target||target!==gesture.target||e.touches.length||!t||Math.hypot(t.clientX-gesture.x,t.clientY-gesture.y)>10)return;
  e.preventDefault();e.stopPropagation();lastTap={target,time:Date.now()};activateRelationControl(e);
 },{passive:false});

  const target=e.target.closest(relationActionSelector);if(!target)return;
  if(lastTap&&lastTap.target===target&&Date.now()-lastTap.time<800&&e.detail!==0){e.preventDefault();e.stopPropagation();return;}
  lastTap=null;activateRelationControl(e);
 });
}

 const term=terms.find(t=>t.id===anchor.dataset.inlineTerm);if(!term)return;
 hideInlineTerm();inlineAnchor=anchor;inlinePinned=pinned;

 inlineTip.querySelector('button').onclick=hideInlineTerm;inlineTip.hidden=false;anchor.setAttribute('aria-expanded','true');
 const a=anchor.getBoundingClientRect(),v=window.visualViewport,pad=10,left=v?v.offsetLeft:0,top=v?v.offsetTop:0,w=v?v.width:innerWidth,h=v?v.height:innerHeight;
